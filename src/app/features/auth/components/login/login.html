<app-auth-layout title="Inicia sesión con tu cuenta" [showBackButton]="false">
  <div class="space-y-4">
    <button type="button" (click)="loginWithEmail()">Iniciar sesión</button>

    <button type="button" (click)="loginWithCurp()">Iniciar sesión con CURP</button>

    <div class="text-center">
      <p class="text-gray-400">¿No tienes una cuenta?</p>
      <a routerLink="../register"> registrate aquí </a>
    </div>
  </div>
</app-auth-layout>
